name: build-and-lint # workflow name shown in the GitHub Actions UI

# Triggers: when this workflow should run
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Lint backend
        working-directory: Backend
        run: npm run lint -- --max-warnings=50

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Lint frontend
        working-directory: Frontend
        run: npm run lint -- --max-warnings=50

      - name: Build backend image
        run: docker build -t backend ./Backend

      - name: Build frontend image
        run: docker build -t frontend ./Frontend

  deploy:
    needs: build-and-lint
    # Deploy only on pushes to main (the server runs origin/main, so dev pushes must not deploy)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # This is what makes GitHub create a deployment record for PulseOps
    environment:
      name: production
      url: http://YOUR_EC2_IP_OR_DOMAIN # replace, or delete this line

    steps:
      - name: Add EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -H "$EC2_HOST" >> ~/.ssh/known_hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}

      - name: Write SSH key
        run: |
          echo "${EC2_KEY}" > ec2_key.pem
          chmod 600 ec2_key.pem
        env:
          EC2_KEY: ${{ secrets.EC2_KEY }}

      - name: Deploy on EC2 (git pull + docker compose up -d --build)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          ssh -o ConnectTimeout=10 -i ec2_key.pem ${EC2_USER}@${EC2_HOST} << EOF
            set -e
            cd "${EC2_APP_DIR}"

            git fetch --all
            git reset --hard origin/main

            docker compose up -d --build

            docker image prune -f

            docker compose ps
          EOF

      - name: Remove SSH key
        if: always()
        run: rm -f ec2_key.pem