services:
  backend:
    build: ./Backend
    container_name: backend
    restart: always
    env_file:
      - ./Backend/.env
    ports:
      - "5000:3000"
  frontend:
    build: 
        context: ./Frontend
        args: 
          VITE_API_URL: http://54.90.76.7:5000/api
    container_name: frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

